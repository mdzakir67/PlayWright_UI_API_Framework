name: Playwright Tests

on:
  push:
  pull_request:
  workflow_dispatch:
  inputs:
    test_suite_type:
      description: "Select test suite"
      required: true
      default: "all"
      type: choice
      options:
        - all
        - smoke
        - api
        - ui
        - regression

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Playwright image
        run: docker build -t playwright-ui-api-framework:latest .

      - name: Create test artifact directories
        run: mkdir -p playwright-report test-results
      
      - name: Select test command
        id: test-command
        run: |
          case "${{ inputs.test_suite_type }}" in
            all)
              echo "command=npm test" >> "$GITHUB_OUTPUT"
              ;;
            smoke)
              echo "command=npm run test:smoke" >> "$GITHUB_OUTPUT"
              ;;
            api)
              echo "command=npm run test:api" >> "$GITHUB_OUTPUT"
              ;;
            ui)
              echo "command=npm run test:ui" >> "$GITHUB_OUTPUT"
              ;;
            regression)
              echo "command=npm run test:regression" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Run Playwright tests
        run: docker run --rm -e UI_BASE_URL=https://eventhub.rahulshettyacademy.com -e API_BASE_URL=https://api.eventhub.rahulshettyacademy.com/api/ -v "${{ github.workspace }}/playwright-report:/app/playwright-report" -v "${{ github.workspace }}/test-results:/app/test-results" playwright-ui-api-framework:latest ${{ steps.test-command.outputs.command }}

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
      
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 7
