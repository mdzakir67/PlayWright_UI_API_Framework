name: Playwright Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Playwright image
        run: docker build -t playwright-ui-api-framework:latest .

      - name: Create test artifact directories
        run: mkdir -p playwright-report test-results

      - name: Run Playwright tests
        run: docker run --rm -e UI_BASE_URL=https://eventhub.rahulshettyacademy.com -e API_BASE_URL=https://api.eventhub.rahulshettyacademy.com/api/ -v "${{ github.workspace }}/playwright-report:/app/playwright-report" -v "${{ github.workspace }}/test-results:/app/test-results" playwright-ui-api-framework:latest

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 7